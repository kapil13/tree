name: Android APK

on:
  workflow_dispatch:
    inputs:
      byot_api:
        description: "API URL baked into APK (production: https://api.aranyix.tech)"
        required: false
        default: "https://api.aranyix.tech"
  push:
    branches:
      - main
      - cursor/android-apk-workflow-main-f2ba
      - cursor/android-apk-v110-beta-f2ba
      - cursor/android-apk-build-f2ba
      - cursor/mobile-full-app-apk-f2ba
    tags:
      - "android-v*"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android project present
        run: |
          if [ ! -f mobile/android/app/build.gradle.kts ]; then
            echo "::error::mobile/android/ not found"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Must match the Flutter version that generated mobile/android/ (AGP 9.x)
          flutter-version: "3.44.8"
          cache: true

      - name: Accept Android SDK licenses
        run: |
          flutter --version
          yes | flutter doctor --android-licenses || true

      - name: Build release APK
        working-directory: mobile
        env:
          BYOT_API: ${{ github.event.inputs.byot_api || 'https://api.aranyix.tech' }}
        run: |
          flutter pub get
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          flutter build apk --release --dart-define="BYOT_API=${BYOT_API}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/aranyix-android-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aranyix-android-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/aranyix-android-*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Job summary
        env:
          BYOT_API: ${{ github.event.inputs.byot_api || 'https://api.aranyix.tech' }}
        run: |
          {
            echo "### Aranyix Android APK built successfully"
            echo ""
            echo "1. Open this workflow run → **Artifacts** → download \`aranyix-android-apk\`"
            echo "2. Install \`aranyix-android-*.apk\` (or \`app-release.apk\`) on your Android phone"
            echo "3. API URL baked in: \`${BYOT_API}\`"
            echo "4. Production API: https://api.aranyix.tech/health"
            echo "5. Demo login: demo@byot.earth / byotdemo1234!"
          } >> "$GITHUB_STEP_SUMMARY"
