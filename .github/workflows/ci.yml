name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: byot
          POSTGRES_PASSWORD: byot
          POSTGRES_DB: byot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U byot -d byot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
      - name: Typecheck (mypy)
        working-directory: backend
        run: mypy --follow-imports=skip app/core/rls.py app/middleware/ app/schemas/common.py
      - name: OpenAPI drift check
        run: bash scripts/ci/check-openapi-drift.sh
      - name: Migration smoke (alembic upgrade head)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://byot:byot@localhost:5432/byot_test
          DATABASE_URL_SYNC: postgresql+psycopg2://byot:byot@localhost:5432/byot_test
          JWT_SECRET: ci-only-secret-32-chars-minimum-xx
          APP_ENV: test
        run: alembic upgrade head
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://byot:byot@localhost:5432/byot_test
          DATABASE_URL_SYNC: postgresql+psycopg2://byot:byot@localhost:5432/byot_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-only-secret
          APP_ENV: test
        run: pytest -q

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - name: Install
        working-directory: frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: i18n parity
        working-directory: frontend
        run: npm run i18n:check
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests (incl. axe-core a11y)
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: npm run build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high || true
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

  e2e-api:
    name: Playwright API smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: byot
          POSTGRES_PASSWORD: byot
          POSTGRES_DB: byot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U byot -d byot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start API
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://byot:byot@localhost:5432/byot_test
          DATABASE_URL_SYNC: postgresql+psycopg2://byot:byot@localhost:5432/byot_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-only-secret-32-chars-minimum-xx
          APP_ENV: test
        run: |
          pip install -r requirements-dev.txt
          alembic upgrade head
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo "Waiting for API health/live..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health/live >/dev/null 2>&1; then
              echo "API ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become ready within 120s"
          tail -n 200 /tmp/uvicorn.log || true
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Playwright smoke
        working-directory: frontend
        env:
          PLAYWRIGHT_API_URL: http://localhost:8000
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx playwright install chromium --with-deps
          npx playwright test e2e/platform-smoke.spec.ts
